- name: Install and Configure nginx
  hosts: all
  become: yes
  
  vars_prompt:
  - name: code_server_version
    prompt: "Enter code-server version (e.g., 4.106.3)"
    private: false
    default: "4.106.3"
  - name: code_server_password
    prompt: "Enter password for code-server"
    private: true
    confirm: true

  tasks:  
    - name: Download and install code-server
      shell: |
        curl -fsSL https://code-server.dev/install.sh | sh
      args:
        creates: /usr/bin/code-server
      environment:
        VERSION: "{{ code_server_version }}"

    - name: Replace password placeholder in code-server.service
      replace:
        path: /lib/systemd/system/code-server.service
        regexp: '__PLACEHOLDER__'
        replace: "{{ code_server_password }}"

    - name: Create code-server systemd conf file
      template:
        src: /home/fred/myrepo/workshop03/build/code-server.conf
        dest: /etc/nginx/sites-available/code-server.conf
        mode: '0644'

    - name: Get droplet IP address
      set_fact:
        droplet_ip: "{{ ansible_default_ipv4.address }}"

    - name: Replace IP placeholder in code-server.conf
      replace:
        path: /etc/nginx/sites-available/code-server.conf
        regexp: '__droplet_IP__'
        replace: "{{ droplet_ip }}"

    - name: Ensure code-server systemd directory exists
      file:
        path: /lib/systemd/system
        state: directory
        mode: '0755'

    - name: Remove default nginx site
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Enable code-server nginx site
      file:
        src: /etc/nginx/sites-available/code-server.conf
        dest: /etc/nginx/sites-enabled/code-server.conf
        state: link

    - name: Reload systemd daemon
      systemd:
        daemon_reload: yes
        
    - name: Enable and start code-server service
      systemd:
        name: code-server
        enabled: yes
        state: restarted
        daemon_reload: yes

    - name: Restart nginx service
      systemd:
        name: nginx
        enabled: yes
        state: restarted
        daemon_reload: yes

    - name: Wait for code-server to be ready
      wait_for:
        port: 8080
        host: 127.0.0.1
        delay: 5
        timeout: 60

    - name: Display access information
      debug:
        msg:
          - "Code-server is now running!"
          - "Access URL: http://{{ droplet_ip }}"
          - "Domain URL: http://code-{{ droplet_ip }}.nip.io"
          - "Password: {{ code_server_password }}"