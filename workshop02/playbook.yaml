- name: Install and Configure Code-Server
  hosts: all
  become: yes
  tasks:
    - name: Install required packages
      apt:
        name:
          - curl
        state: present
    - name: Download and install code-server
      shell: |
        curl -fsSL https://code-server.dev/install.sh | sh
      args:
        creates: /usr/bin/code-server
    - name: Ensure code-server systemd directory exists
      file:
        path: /lib/systemd/system
        state: directory
        mode: '0755'
    - name: Create code-server systemd service file
      template:
        src: /home/fred/myrepo/workshop02/code-server.service
        dest: /lib/systemd/system/code-server.service
        mode: '0644'
